name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Actions are pinned to commit SHAs (a tag can be moved); Dependabot keeps them up to date.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Install the exact SDK packages the build uses instead of relying on what the runner
      # image happens to include.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Also validates the Gradle wrapper checksum. The "basic" cache provider is the fully
      # open-source one, built on the standard GitHub Actions cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Unit, Room and UI tests (JVM, Robolectric)
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # Each assemble task also verifies that the merged manifest has no INTERNET permission.
      - name: Build debug APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # Secrets are not available to pull requests from forks, so those builds use the fallback.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/habit-tracker-release.jks"
            echo "HABIT_TRACKER_STORE_FILE=$RUNNER_TEMP/habit-tracker-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from GitHub Secrets."
          else
            echo "SIGNING_ARGS=-PhabitTrackerDebugSignRelease=true" >> "$GITHUB_ENV"
            echo "::warning title=Debug-signed APK::Signing secrets are not set, so this release APK is signed with a throwaway debug key. Each such build has a different key, so it can't be installed as an update over a previous build. See README > Release signing."
          fi

      # Minified with R8.
      - name: Build release APK
        env:
          HABIT_TRACKER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HABIT_TRACKER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HABIT_TRACKER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease $SIGNING_ARGS

      # Pull-request builds (including ones from forks) are labelled, so nobody mistakes an APK
      # built from unmerged code for one built from main.
      - name: Name the APK
        id: apk
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          SUFFIX=""
          if [ -n "$PR_NUMBER" ]; then SUFFIX="-pr${PR_NUMBER}-untrusted"; fi
          NAME="HabitTracker-${VERSION}-${GITHUB_SHA::7}${SUFFIX}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "debug_name=app-debug${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.debug_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/habit-tracker-release.jks"
