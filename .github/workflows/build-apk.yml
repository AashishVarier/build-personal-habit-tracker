name: Build APK

# One click from the Actions tab (Build APK → Run workflow): builds the release APK and publishes
# it as a GitHub Release, so it can be downloaded straight to a phone. Only people with write
# access to the repository can start it. Tests and lint run in ci.yml on every push instead.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload the APK to it

    steps:
      # Actions are pinned to commit SHAs (a tag can be moved); Dependabot keeps them up to date.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Also validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/habit-tracker-release.jks"
            echo "HABIT_TRACKER_STORE_FILE=$RUNNER_TEMP/habit-tracker-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from GitHub Secrets."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning title=Test build::Signing secrets are not set, so this APK is signed with a throwaway key and can't be installed over an earlier build. See README > Signing in GitHub Actions."
          fi

      # Minified with R8. Fails if the INTERNET permission ever appears in the manifest.
      - name: Build release APK
        env:
          HABIT_TRACKER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HABIT_TRACKER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HABIT_TRACKER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleRelease -PhabitTrackerDebugSignRelease=true
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          VERSION=$(jq -r '.elements[0].versionName' "$APK_DIR/output-metadata.json")
          COMMIT=${GITHUB_SHA::7}
          TAG="build-$GITHUB_RUN_NUMBER"
          APK="$RUNNER_TEMP/HabitTracker-$VERSION-build$GITHUB_RUN_NUMBER-$COMMIT.apk"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cp "$APK_DIR/app-release.apk" "$APK"

          if [ "$SIGNED" = "true" ]; then
            TITLE="Habit Tracker $VERSION (build $GITHUB_RUN_NUMBER)"
            PRERELEASE=()
            cat > "$NOTES" <<EOF
          Signed with this repository's release key, so it installs as an update over earlier signed builds and keeps your data.

          **Install:** open this page on your phone, tap the .apk file below, and allow your browser to install apps if Android asks.

          Built from commit $COMMIT.
          EOF
          else
            TITLE="Habit Tracker $VERSION (build $GITHUB_RUN_NUMBER), test build"
            PRERELEASE=(--prerelease)
            cat > "$NOTES" <<EOF
          **Test build.** The signing secrets aren't set in this repository, so this APK is signed with a throwaway key.

          - It installs fine on a phone that doesn't have the app yet.
          - It **can't** be installed over an earlier build. To switch, you have to uninstall the old app first, and that deletes its data. Before uninstalling, use **Settings → Export to Excel** in the app. After installing, restore the file during onboarding or with **Settings → Restore from an Excel backup**.
          - To get builds that install as updates, add the signing secrets once: see "Signing in GitHub Actions" in the README.

          **Install:** open this page on your phone, tap the .apk file below, and allow your browser to install apps if Android asks.

          Built from commit $COMMIT.
          EOF
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run of a run that already published: replace the APK.
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" "${PRERELEASE[@]}"
          fi
          echo "### Published [$TITLE](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/habit-tracker-release.jks"
